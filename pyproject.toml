[project]
name = "aimarket-basanos"
version = "0.1.0"
description = "BASANOS — signed Solidity assurance packs for AICOM ecosystem contracts. Technical layer, not AgentAuditPool insurance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.12,<1",
]

[project.urls]
Documentation = "https://github.com/alexar76/basanos#readme"
Issues = "https://github.com/alexar76/basanos/issues"
Repository = "https://github.com/alexar76/basanos"

[tool.hatch.build.targets.wheel]
packages = ["basanos"]
only-include = [
    "basanos",
    "agent.py",
    "configure_provider.py",
    "validate_manifest.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/basanos",
    "/agent.py",
    "/configure_provider.py",
    "/validate_manifest.py",
    "/capability.json",
    "/frontend",
    "/tests",
    "/docs",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Dockerfile",
    "/.dockerignore",
    "/.env.example",
    "/pyproject.toml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=basanos --cov=agent --cov=configure_provider --cov=validate_manifest --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
